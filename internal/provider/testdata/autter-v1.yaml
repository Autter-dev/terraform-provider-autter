    SyntheticCheckInput:
      type: object
      properties:
        kind:
          description: Default http. journey replays a saved journey of the repository (the Journeys tab) in a browser against url, with no AI calls; only signed-out journeys that write nothing can be checked. Fixed once the check exists.
          type: string
          enum:
            - http
            - journey
        name:
          description: When sent, it must equal the name in the path.
          type: string
          maxLength: 120
        url:
          type: string
          maxLength: 2000
          description: An http or https address reachable from the internet. For a journey check, the site's address only (https://app.example.com); the journey opens its own pages on it.
        journey_id:
          description: "Journey checks: the journey to replay (required). Must be null or absent for an http check."
          anyOf:
            - type: string
              maxLength: 200
            - type: "null"
        method:
          description: Default GET.
          type: string
          enum:
            - GET
            - HEAD
        headers:
          description: "Request headers, stored encrypted and never returned. Absent: no headers. At most 20."
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        expected_status:
          description: Default 200.
          type: integer
          minimum: 100
          maximum: 599
        body_contains:
          description: Text the response body must contain (GET only).
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
        timeout_ms:
          description: Default 10000.
          type: integer
          minimum: 1000
          maximum: 30000
        interval_seconds:
          description: "http: 60, 300, 900 or 3600, default 300; the free plan runs them every 300 seconds at the fastest. journey: 900, 3600, 21600 or 86400, default 3600; the free plan runs them every 3600 seconds at the fastest."
          anyOf:
            - type: number
              const: 60
            - type: number
              const: 300
            - type: number
              const: 900
            - type: number
              const: 3600
            - type: number
              const: 21600
            - type: number
              const: 86400
        latency_threshold_ms:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 30000
            - type: "null"
        failures_to_fire:
          description: Failures in a row before the check opens a Runtime issue. Default 2.
          type: integer
          minimum: 1
          maximum: 10
        service:
          description: "The service the issue is filed under. Default: the URL's host."
          anyOf:
            - type: string
              maxLength: 100
            - type: "null"
        environment:
          description: Default production.
          anyOf:
            - type: string
              maxLength: 64
            - type: "null"
        enabled:
          description: Default true.
          type: boolean
      required:
        - url
      additionalProperties: false
