                            maxLength: 60
                          op:
                            type: string
                            enum:
                              - eq
                              - neq
                              - contains
                              - not_contains
                              - starts_with
                              - in
                              - not_in
                              - gt
                              - gte
                              - lt
                              - lte
                          value:
                            anyOf:
                              - type: string
                                maxLength: 200
                              - type: number
                              - maxItems: 50
                                type: array
                                items:
                                  anyOf:
                                    - type: string
                                      maxLength: 200
                                    - type: number
                        required:
                          - field
                          - op
                          - value
                        additionalProperties: false
                    sql:
                      description: "For source sql: one read-only SELECT."
                      type: string
                      maxLength: 8000
                  required:
                    - id
                    - title
                    - viz
                    - source
                  additionalProperties: false
              layout:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 40
                    w:
                      type: integer
                      minimum: 1
                      maximum: 12
                      description: Columns of 12.
                    h:
                      type: integer
                      minimum: 1
                      maximum: 4
                      description: Rows.
                  required:
                    - id
                    - w
                    - h
                  additionalProperties: false
              created_by:
                anyOf:
                  - type: string
                  - type: "null"
