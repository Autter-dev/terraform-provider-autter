        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NameConflict"
        "422":
          $ref: "#/components/responses/LimitReached"
        "429":
