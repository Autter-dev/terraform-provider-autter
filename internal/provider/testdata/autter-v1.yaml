              anyOf:
                - type: object
                  properties:
                    min_events:
                      anyOf:
                        - type: integer
                          minimum: 1
                          maximum: 9007199254740991
                        - type: "null"
                    min_users:
                      anyOf:
                        - type: integer
                          minimum: 1
                          maximum: 9007199254740991
                        - type: "null"
                    window_minutes:
                      description: Default 60.
                      type: integer
                      minimum: 1
                      maximum: 10080
                  additionalProperties: false
                - type: "null"
          required:
            - environments
