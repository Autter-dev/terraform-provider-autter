      tags:
        - Synthetic checks
      summary: Create or update a synthetic check by name
      description: "Idempotent: the body is the whole synthetic check, and fields left out take their defaults. Creates the synthetic check when none has this name (201), updates the one that has it (200), and writes nothing when it already matches (200). Each write is recorded in the organization's audit log. HTTP checks Autter requests on a schedule, and journey checks (kind journey) that replay a saved signed-out, read-only journey in a browser; a check that keeps failing opens a Runtime issue (a journey check only after it has passed once). Refused with feature_disabled until the organization turns synthetic checks on. Writing needs the owner or admin role; the plan limits the number of checks and the fastest interval (limit_reached). Scope: api:write."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyntheticCheckInput"
      responses:
