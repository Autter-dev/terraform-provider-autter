components:
  responses:
    InvalidArgument:
      description: The request does not validate; the message says what to change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No token, or a token that is revoked, expired or no longer a member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The token lacks the scope (insufficient_scope), the member lacks the role (insufficient_role), or the feature is off (feature_disabled).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such repository (repository_not_found) or resource (not_found).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NameConflict:
      description: Two or more resources already share this name (name_conflict).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LimitReached:
      description: The plan's limit is reached (limit_reached).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: The token's rate limit is reached (rate_limited); retry after Retry-After seconds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal access token (autter_pat_…).
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - insufficient_scope
                - insufficient_role
                - feature_disabled
                - repository_not_found
                - not_found
                - name_conflict
                - invalid_argument
                - limit_reached
                - rate_limited
                - internal_error
            message:
              type: string
              description: What went wrong and, for a request that can be corrected, what to change.
            detail: {}
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Repository:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: The short name, as the dashboard shows it.
        full_name:
          type: string
          description: owner/repo
        default_branch:
          anyOf:
            - type: string
            - type: "null"
        enabled:
          type: boolean
      required:
        - id
        - name
        - full_name
        - default_branch
        - enabled
      additionalProperties: false
    RepositoryList:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
                description: The short name, as the dashboard shows it.
              full_name:
                type: string
                description: owner/repo
              default_branch:
                anyOf:
                  - type: string
                  - type: "null"
              enabled:
                type: boolean
            required:
              - id
              - name
              - full_name
              - default_branch
              - enabled
            additionalProperties: false
      required:
        - data
      additionalProperties: false
    AlertRuleInput:
      type: object
      properties:
        name:
          description: When sent, it must equal the name in the path.
          type: string
          maxLength: 120
        enabled:
          description: Default true.
          type: boolean
        triggers:
          minItems: 1
          type: array
          items:
            type: string
            enum:
              - new
              - regressed
              - spiking
              - assigned
              - resolved
        filters:
          type: object
          properties:
            environments:
              description: "Empty or absent: any environment."
              maxItems: 50
              type: array
              items:
                type: string
                maxLength: 200
            services:
              maxItems: 50
              type: array
              items:
                type: string
                maxLength: 200
            levels:
              description: Issue levels, for example fatal, error, warning.
              maxItems: 50
              type: array
              items:
                type: string
                maxLength: 200
            priorities:
              maxItems: 50
              type: array
              items:
                type: string
                enum:
                  - p0
                  - p1
                  - p2
                  - p3
                  - none
            error_type:
              anyOf:
                - type: object
                  properties:
                    op:
                      type: string
                      enum:
                        - equals
                        - contains
                        - starts_with
                        - regex
                    value:
                      type: string
                      maxLength: 200
                  required:
                    - op
                    - value
                - type: "null"
            message:
              description: Matched against the issue's message, or its title when it has none.
              anyOf:
                - type: object
                  properties:
                    op:
                      type: string
                      enum:
                        - equals
                        - contains
                        - starts_with
                        - regex
                    value:
                      type: string
                      maxLength: 200
                  required:
                    - op
                    - value
                - type: "null"
            assignee:
              description: any (default), assigned, unassigned, me (the rule's author) or user:<id>.
              type: string
              maxLength: 205
            threshold:
              description: Alert only once the issue has at least this many events or users within the window.
              anyOf:
                - type: object
                  properties:
                    min_events:
                      anyOf:
                        - type: integer
                          minimum: 1
                          maximum: 9007199254740991
                        - type: "null"
                    min_users:
                      anyOf:
                        - type: integer
                          minimum: 1
                          maximum: 9007199254740991
                        - type: "null"
                    window_minutes:
                      description: Default 60.
                      type: integer
                      minimum: 1
                      maximum: 10080
                - type: "null"
        actions:
          type: object
          properties:
            slack:
              anyOf:
                - type: object
                  properties:
                    channel_id:
                      description: "Null or absent: the repository's Slack route."
                      anyOf:
                        - type: string
                          maxLength: 200
                        - type: "null"
                - type: "null"
            email:
              description: A line in each recipient's daily update summary.
              anyOf:
                - type: object
                  properties:
                    assignee:
                      type: boolean
                    watchers:
                      description: The issue's assignee and every member who assigned, resolved, ignored or reopened it.
                      type: boolean
                    user_ids:
                      maxItems: 50
                      type: array
                      items:
                        type: string
                        maxLength: 200
                    everyone:
                      type: boolean
                - type: "null"
            in_app:
              anyOf:
                - type: object
                  properties:
                    assignee:
                      type: boolean
                    watchers:
                      description: The issue's assignee and every member who assigned, resolved, ignored or reopened it.
                      type: boolean
                    user_ids:
                      maxItems: 50
                      type: array
                      items:
                        type: string
                        maxLength: 200
                    everyone:
                      type: boolean
                - type: "null"
            oncall:
              description: Page on-call when the issue is critical (p0, or a fatal error).
              type: boolean
            auto_assignments:
              description: Also send automatic assignments to Slack and on-call.
              type: boolean
          description: At least one of slack, email, in_app or oncall.
      required:
        - triggers
        - actions
      additionalProperties: false
    AlertRule:
      type: object
      properties:
        id:
          type: string
        repository_id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        triggers:
          type: array
          items:
            type: string
            enum:
              - new
              - regressed
              - spiking
              - assigned
              - resolved
        filters:
          type: object
          properties:
            environments:
              description: "Empty or absent: any environment."
              maxItems: 50
              type: array
              items:
                type: string
                maxLength: 200
            services:
              maxItems: 50
              type: array
              items:
                type: string
                maxLength: 200
            levels:
              description: Issue levels, for example fatal, error, warning.
              maxItems: 50
              type: array
              items:
                type: string
                maxLength: 200
            priorities:
              maxItems: 50
              type: array
              items:
                type: string
                enum:
                  - p0
                  - p1
                  - p2
                  - p3
                  - none
            error_type:
              anyOf:
                - type: object
                  properties:
                    op:
                      type: string
                      enum:
