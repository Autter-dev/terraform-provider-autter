          $ref: "#/components/responses/RateLimited"
  /repositories/{repository}/alert-rules/{name}:
    parameters:
      - name: repository
        in: path
        required: true
        description: The repository's id, or its full name with the slash encoded (owner%2Frepo), or a short name only one repository has.
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: The alert rule's name, URL-encoded. Names are unique per repository through the API.
        schema:
          type: string
          maxLength: 120
    get:
      operationId: getAlertRule
      tags:
        - Alert rules
      summary: Get a alert rule by name
      description: "Scope: api:read."
      responses:
        "200":
          description: The alert rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NameConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      operationId: putAlertRule
      tags:
        - Alert rules
      summary: Create or update a alert rule by name
      description: "Idempotent: the body is the whole alert rule, and fields left out take their defaults. Creates the alert rule when none has this name (201), updates the one that has it (200), and writes nothing when it already matches (200). Each write is recorded in the organization's audit log. Which Runtime issue events (new, regressed, spiking, assigned, resolved) reach Slack, email, in-app or on-call. Reading lists a repository's starting rules the first time. Writing needs the owner or admin role. Scope: api:write."
      requestBody:
        required: true
