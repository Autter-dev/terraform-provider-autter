info:
  title: Autter API
  version: 1.0.0
  description: "Alert rules, synthetic checks and dashboards as code. Authenticate with a personal access token (Settings → Access Tokens) as a bearer token: one without scope restrictions, or one with api:read (reads) and api:write (writes). A token scoped to MCP only is refused. The API has its own rate limit per token, apart from MCP's: 60 reads and 10 writes a minute. Request bodies can be up to 1 MB. Fields are snake_case. This document is generated from the server's validation schemas."
servers:
  - url: https://api.autter.dev/api/v1
security:
  - bearerAuth: []
tags:
  - name: Repositories
  - name: Alert rules
  - name: Synthetic checks
  - name: Dashboards
paths:
  /repositories:
    get:
      operationId: listRepositories
      tags:
        - Repositories
      summary: List the organization's repositories
      description: "Every repository connected to the token's organization. Scope: api:read."
      responses:
        "200":
          description: The repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /repositories/{repository}/alert-rules:
    parameters:
      - name: repository
        in: path
        required: true
        description: The repository's id, or its full name with the slash encoded (owner%2Frepo), or a short name only one repository has.
        schema:
          type: string
    get:
      operationId: listAlertRules
      tags:
        - Alert rules
      summary: List a repository's alert rules
      description: "Which Runtime issue events (new, regressed, spiking, assigned, resolved) reach Slack, email, in-app or on-call. Reading lists a repository's starting rules the first time. Writing needs the owner or admin role. Oldest first. Scope: api:read."
      responses:
        "200":
          description: The alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
