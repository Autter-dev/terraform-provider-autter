version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - misspell
    - nilerr
    - predeclared
    - unconvert
    - unparam
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Autter-dev/terraform-provider-autter
